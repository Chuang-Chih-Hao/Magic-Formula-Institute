name: Test magic shop
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server.js
          node --check public/app.js
          node --check fair-server.js
          node --check fair-questions.js
          node --check public/fair.js
      - name: Run classroom integration tests
        run: npm test
